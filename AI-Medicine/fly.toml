# Fly.io config — deploy with: fly launch (first time) then fly deploy
# Docs: https://fly.io/docs/languages-and-frameworks/docker/

app = "ai-medicine"

[build]

[env]
  CORS_ALLOW_ALL = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "10s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
