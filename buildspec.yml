# AWS CodeBuild - build AI-Medicine Docker image and push to ECR
# Create CodeBuild project: Source=GitHub (this repo), Build spec=buildspec.yml

version: 0.2

phases:
  pre_build:
    commands:
      - export AWS_REGION=${AWS_REGION:-us-east-1}
      - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
      - export REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/ai-medicine
  build:
    commands:
      - echo Building Docker image...
      - docker build -t $REPOSITORY_URI:latest ./AI-Medicine
  post_build:
    commands:
      - echo Pushing to ECR...
      - docker push $REPOSITORY_URI:latest
