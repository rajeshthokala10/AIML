# Run the full GraphRAG stack:
#
#     cd LangGraph/GraphRAG
#     cp .env.example .env   # then fill in OPENAI_API_KEY / LANGCHAIN_API_KEY
#     docker compose up --build
#
# Streamlit:  http://localhost:8501
# Qdrant UI:  http://localhost:6333/dashboard
#
# Volumes persist the Qdrant collections, the HuggingFace model cache, and
# the data folder so re-runs don't re-download / re-ingest from scratch.

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: graphrag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  graphrag:
    build:
      context: .
      dockerfile: Dockerfile
    image: graphrag-app:latest
    container_name: graphrag-app
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Wire the app to the Qdrant service above. build_qdrant() reads this
      # env var first and falls back to config.yaml only when it is unset.
      QDRANT_URL: "http://qdrant:6333"
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./cache:/app/cache

volumes:
  qdrant_storage:
